name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows credential backend
        if: runner.os == 'Windows'
        run: python -m pip install "keyring>=25,<26"
      - run: npm test
      - run: python -m unittest discover -s scripts -p "test_*.py"
        env:
          ZENTAO_TEST_SYSTEM_CREDENTIALS: '1'
      - run: npm pack --dry-run
